<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#2f3e56" />
        <title>Tidak ada koneksi | Zakiah Backoffice</title>
        <link rel="icon" type="image/png" href="/pwa/icon-192.png?v=3" />
        <style>
            :root {
                color-scheme: light dark;
                --bg: #faf7f1;
                --card: #ffffff;
                --fg: #1f2a3c;
                --muted: #5f6b80;
                --primary: #2f3e56;
                --teal: #1f7f8c;
                --gold: #d6b07a;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #12161f;
                    --card: #1b2130;
                    --fg: #f3efe7;
                    --muted: #a8b2c4;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    'Poppins',
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    sans-serif;
                text-align: center;
            }

            .card {
                width: 100%;
                max-width: 360px;
                padding: 32px 24px;
                border-radius: 28px;
                background: var(--card);
                box-shadow: 0 20px 50px -20px rgb(31 42 60 / 0.35);
                border-top: 5px solid transparent;
                border-image: linear-gradient(
                        90deg,
                        var(--primary),
                        var(--gold),
                        var(--teal),
                        #e5545a
                    )
                    1;
            }

            img {
                width: 72px;
                height: 72px;
                border-radius: 20px;
            }

            h1 {
                margin: 20px 0 8px;
                font-size: 20px;
            }

            p {
                margin: 0 0 24px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.5;
            }

            button {
                width: 100%;
                height: 48px;
                border: 0;
                border-radius: 14px;
                background: linear-gradient(90deg, var(--primary), var(--teal));
                color: #fff;
                font: inherit;
                font-weight: 600;
                font-size: 15px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <img src="/pwa/icon-192.png?v=3" alt="" />
            <h1>Kamu sedang offline</h1>
            <p>
                Periksa koneksi internet, lalu coba lagi. Data penjualan dan
                stok perlu koneksi agar selalu terbaru.
            </p>
            <button type="button" onclick="location.reload()">Coba lagi</button>
        </main>
        <script>
            window.addEventListener('online', () => location.reload());
        </script>
    </body>
</html>
